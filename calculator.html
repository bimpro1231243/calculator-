<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f9;
      margin: 0;
    }

    .calculator {
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    #display {
      width: 220px;
      height: 40px;
      font-size: 24px;
      text-align: right;
      margin-bottom: 20px;
      padding: 10px;
      background-color: #f1f1f1;
      border: none;
      border-radius: 5px;
      color: #333;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 60px);
      grid-gap: 10px;
    }

    .buttons button {
      width: 60px;
      height: 60px;
      font-size: 18px;
      background-color: #f1f1f1;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .buttons button:hover {
      background-color: #ddd;
    }

    .buttons button:active {
      background-color: #ccc;
    }

    .buttons button.clear {
      background-color: #ff7043;
      color: white;
    }

    .buttons button.equal {
      background-color: #4caf50;
      color: white;
    }

    /* Creator Info Section */
    .creator-info {
      margin-top: 30px;
      font-size: 14px;
      text-align: center;
      color: #333;
    }

    .creator-info a {
      color: #4caf50;
      text-decoration: none;
    }

    .creator-info a:hover {
      text-decoration: underline;
    }

    /* Visitor Counter */
    .visitor-counter {
      margin-top: 10px;
      font-size: 14px;
      color: #333;
    }

  </style>
</head>
<body>

<div class="calculator">
  <input type="text" id="display" disabled>
  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button onclick="appendNumber('7')">7</button>
    <button onclick="appendNumber('8')">8</button>
    <button onclick="appendNumber('9')">9</button>
    <button onclick="appendOperator('/')">/</button>

    <button onclick="appendNumber('4')">4</button>
    <button onclick="appendNumber('5')">5</button>
    <button onclick="appendNumber('6')">6</button>
    <button onclick="appendOperator('*')">*</button>

    <button onclick="appendNumber('1')">1</button>
    <button onclick="appendNumber('2')">2</button>
    <button onclick="appendNumber('3')">3</button>
    <button onclick="appendOperator('-')">-</button>

    <button onclick="appendNumber('0')">0</button>
    <button onclick="appendDecimal()">.</button>
    <button class="equal" onclick="calculateResult()">=</button>
    <button onclick="appendOperator('+')">+</button>
  </div>
</div>

<!-- Creator Info Section -->
<div class="creator-info">
  <p>Created by <strong>Bim</strong></p>
  <p>For more info, visit <a href="https://yourwebsite.com" target="_blank">yourwebsite.com</a></p>
</div>

<!-- Visitor Counter Section -->
<div class="visitor-counter">
  <p>Visitor Count: <span id="visitorCount">Loading...</span></p>
</div>

<script>
  let currentInput = '';
  
  // Visitor counter code using localStorage
  let visitorCount = localStorage.getItem('visitorCount');
  if (!visitorCount) {
    visitorCount = 0;
  }
  visitorCount++;
  localStorage.setItem('visitorCount', visitorCount);
  document.getElementById('visitorCount').textContent = visitorCount;

  function updateDisplay() {
    document.getElementById('display').value = currentInput;
  }

  function appendNumber(number) {
    currentInput += number;
    updateDisplay();
  }

  function appendOperator(operator) {
    // Only add operator if there's a valid number before it
    if (currentInput !== '' && !isNaN(currentInput.slice(-1))) {
      currentInput += operator;
      updateDisplay();
    }
  }

  function appendDecimal() {
    // Only add a decimal if there isn't one already in the current number
    if (!currentInput.includes('.')) {
      currentInput += '.';
      updateDisplay();
    }
  }

  function clearDisplay() {
    currentInput = '';
    updateDisplay();
  }

  function calculateResult() {
    try {
      currentInput = eval(currentInput).toString();
      updateDisplay();
    } catch (e) {
      currentInput = 'Error';
      updateDisplay();
      setTimeout(clearDisplay, 2000);  // Clear after error for 2 seconds
    }
  }
</script>

</body>
</html>
